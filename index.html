<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yari Imposter - Pro Score Edition</title>
    <style>
        :root {
            --bg-dark: #1a0b2e;
            --purple-main: #6a1b9a;
            --purple-light: #9c27b0;
            --glass: rgba(255, 255, 255, 0.1);
            --imposter-red: #ff3d3d;
            --glass-border: rgba(255, 255, 255, 0.25);
            --gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #6a1b9a, #24243e);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            color: white; overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 95%; max-width: 450px; background: var(--glass); backdrop-filter: blur(20px);
            border-radius: 25px; padding: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border); text-align: center; position: relative;
            min-height: 600px; display: flex; flex-direction: column; justify-content: space-between;
        }

        .page { display: none; animation: fadeIn 0.4s ease-out; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .imposter-text { color: var(--imposter-red); text-shadow: 0 0 15px var(--imposter-red); font-family: 'Arial Black', sans-serif; text-transform: uppercase; }

        .btn-main {
            background: linear-gradient(45deg, var(--purple-main), var(--purple-light));
            border: none; padding: 14px; color: white; border-radius: 12px;
            cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; font-size: 16px;
            margin-top: 10px;
        }

        .btn-main:active { transform: scale(0.96); }
        .btn-score { background: #4caf50; margin-top: 5px; font-size: 13px; padding: 8px; }

        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.1); color: white; outline: none; margin: 5px 0; }

        .names-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 180px; overflow-y: auto; padding: 5px; }
        .name-tag { 
            background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 15px; 
            font-size: 14px; border: 1px solid var(--glass-border); display: flex; 
            align-items: center; justify-content: space-between; gap: 5px;
        }
        .score-controls { display: flex; align-items: center; gap: 5px; }
        .btn-mini { width: 25px; height: 25px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; color: white; }
        .btn-plus { background: #4caf50; }
        .btn-minus { background: #f44336; }
        .score-badge { background: var(--gold); color: black; border-radius: 8px; padding: 2px 10px; font-weight: bold; min-width: 30px; text-align: center; }
        .remove-btn { color: #ff4d4d; cursor: pointer; font-weight: bold; font-size: 18px; margin-right: 10px; }

        .grid-7 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 15px 0; }
        .category-item { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); padding: 10px 2px; border-radius: 10px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .category-item.selected { background: var(--purple-light); box-shadow: 0 0 10px var(--purple-light); border-color: white; }

        .role-card {
            background: rgba(255, 255, 255, 0.95); color: #1a0b2e; padding: 50px 20px;
            border-radius: 20px; margin: 20px 0; font-size: 22px; font-weight: bold;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .role-revealed { background: linear-gradient(135deg, #4a148c, #7b1fa2) !important; color: white !important; }

        .timer-display { font-size: 50px; font-weight: bold; margin: 15px 0; text-shadow: 0 0 20px var(--purple-light); }
        .help-box { background: rgba(0, 0, 0, 0.3); border: 1px dashed var(--imposter-red); padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 13px; }

        .grey-footer { font-size: 14px; letter-spacing: 2px; margin-top: 20px; opacity: 0.6; animation: pulseGrey 3s infinite; }
        @keyframes pulseGrey { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); color: var(--purple-light); } }
    </style>
</head>
<body>

<div class="container">
    <div id="page1" class="page active">
        <h1 style="font-size: 2.2rem; margin-top: 40px;">بەخێر بێی بۆ یاری <br><span class="imposter-text">IMPOSTER</span></h1>
        <div style="margin-top: 60px;"><button class="btn-main" onclick="nextPage(2)">دەستپێکردن</button></div>
    </div>

    <div id="page2" class="page">
        <h3><b>ڕێکخستنی یاریزانەکان</b></h3>
        <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 15px; margin: 5px 0; border: 1px solid var(--glass-border);">
            <div style="display: flex; gap: 5px;">
                <input type="text" id="nameInput" placeholder="ناوی یاریزان...">
                <button onclick="addPlayerName()" style="width:50px; border-radius:10px; border:none; background:var(--purple-light); color:white; cursor:pointer;">+</button>
            </div>
            <div id="namesContainer" class="names-grid"></div>
        </div>
        
        <div class="grid-7" id="categoryGrid">
            <div class="category-item" data-cat="کار" onclick="toggleCat(this)">کار</div>
            <div class="category-item" data-cat="خواردن" onclick="toggleCat(this)">خواردن</div>
            <div class="category-item" data-cat="کەلوپەل" onclick="toggleCat(this)">کەلوپەل</div>
            <div class="category-item" data-cat="ئاژەڵ" onclick="toggleCat(this)">ئاژەڵ</div>
            <div class="category-item" data-cat="شار" onclick="toggleCat(this)">شار</div>
            <div class="category-item" data-cat="هەمەجۆر" onclick="toggleCat(this)">هەمەجۆر</div>
            <div class="category-item" data-cat="شتەکان" onclick="toggleCat(this)">شتەکان</div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;"><label style="font-size: 11px;">کات (چرکە)</label><input type="number" id="gameTime" value="60"></div>
            <div style="flex: 1;"><label style="font-size: 11px;">Imposter</label><input type="number" id="imposterCount" value="1"></div>
        </div>
        <button class="btn-main" onclick="startGame()">دەستپێکردنی گەڕ</button>
    </div>

    <div id="page3" class="page">
        <h2 id="currentPlayerName" style="color: var(--purple-light);">ناو</h2>
        <div class="role-card" id="roleCard" onclick="revealRole()">بۆ بینینی ڕۆڵەکەت کلیک بکە</div>
        <div id="imposterHelp" class="help-box" style="display:none;">
            <b style="color:var(--imposter-red)">یارمەتی:</b> تۆ ئیمپۆستەریت! هەوڵبدە وشەی گشتی بەکاربهێنیت.
        </div>
        <button class="btn-main" id="nextTurnBtn" style="display:none; margin-top: 20px;" onclick="nextTurn()">کەسی دواتر</button>
    </div>

    <div id="page4" class="page">
        <h2><b>کاتی گفتوگۆ</b></h2>
        <div class="timer-display" id="timerValue">00:00</div>
        <button class="btn-main" onclick="stopTimerAndGoToTimeout()">تەواو بوو</button>
    </div>

    <div id="pageTimeOut" class="page">
        <h1 class="imposter-text" style="font-size: 3rem; margin-top: 40px;">STOP</h1>
        <button class="btn-main" onclick="finishGame()">ئاشکراکردن</button>
    </div>

    <div id="page5" class="page">
        <h2><b>ئەنجامی گەڕ</b></h2>
        <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; border: 1px solid var(--glass-border); margin: 10px 0;">
            <p>وشەکە: <b style="color:var(--purple-light);" id="finalWord">...</b></p>
            <p>ئیمپۆستەر: <b class="imposter-text" id="finalImposters">...</b></p>
        </div>
        
        <p style="font-size: 14px; margin-bottom: 5px;">کێ بردیەوە؟</p>
        <div style="display: flex; gap: 10px;">
            <button class="btn-main btn-score" onclick="updateScore('citizens')">گرووپ (١ خاڵ)</button>
            <button class="btn-main btn-score" style="background:#f44336;" onclick="updateScore('imposters')">ئیمپۆستەر (٣ خاڵ)</button>
        </div>
        <button class="btn-main" onclick="resetToSetup()" style="margin-top: 20px;">گەڕی نوێ</button>
    </div>

    <div class="grey-footer"><b>Grey</b></div>
</div>

<script>
    let players = []; 
    let selectedCategories = [];
    const gameData = {
        "کار": ["پزیشک", "ئەندازیار", "مامۆستا", "پۆلیس", "جوتیار", "نۆژەنکەرەوە", "سەرتاش", "وێنەگر", "نانەوا", "فڕۆکەوان"],
        "خواردن": ["پیتزا", "کباب", "دۆڵمە", "بەرگر", "برنج", "شێلم", "شۆربا", "مریشک", "ماسی", "یاپراخ"],
        "کەلوپەل": ["قەڵەم", "مۆبایل", "کۆمپیوتەر", "سەعات", "کورسی", "تەلەفزیۆن", "چەتر", "کلیل", "جام", "گوێگرە"],
        "ئاژەڵ": ["شێر", "پشیلە", "فیل", "ئەسپ", "سەگ", "ورچ", "کەروێشک", "مەیمون", "گورگ", "کیسەڵ"],
        "شار": ["هەولێر", "سلێمانی", "دۆهۆک", "کەرکوک", "هەڵەبجە", "بەغداد", "لەندەن", "پاریس", "ئیستانبوڵ", "بەرلین"],
        "هەمەجۆر": ["مانگ", "خۆر", "دەریا", "چیا", "کتێب", "فڕۆکە", "ئۆتۆمبێل", "باران", "بەفر", "ئەستێرە"],
        "شتەکان": ["کەوچک", "قاپ", "پەردە", "فڵچە", "سابوون", "شانە", "بالیف", "میز", "پێڵاو", "جامانە"]
    };

    let secretWord = "", imposters = [], turnIndex = 0, isRevealed = false, timerInterval;

    function nextPage(p) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        const target = (typeof p === 'number') ? document.getElementById('page' + p) : document.getElementById(p);
        target.classList.add('active');
    }

    function addPlayerName() {
        const input = document.getElementById('nameInput');
        const name = input.value.trim();
        if (name && players.length < 12) {
            players.push({ name: name, score: 0 });
            renderNames();
            input.value = "";
        }
    }

    function renderNames() {
        const container = document.getElementById('namesContainer');
        container.innerHTML = players.map((p, index) => `
            <div class="name-tag">
                <div style="display:flex; align-items:center;">
                    <span class="remove-btn" onclick="removeName(${index})">×</span>
                    <b>${p.name}</b>
                </div>
                <div class="score-controls">
                    <button class="btn-mini btn-minus" onclick="manualScore(${index}, -1)">-</button>
                    <span class="score-badge">${p.score}</span>
                    <button class="btn-mini btn-plus" onclick="manualScore(${index}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function manualScore(index, val) {
        players[index].score += val;
        if(players[index].score < 0) players[index].score = 0;
        renderNames();
    }

    function removeName(index) { players.splice(index, 1); renderNames(); }

    function toggleCat(el) {
        const cat = el.getAttribute('data-cat');
        if (selectedCategories.includes(cat)) {
            selectedCategories = selectedCategories.filter(c => c !== cat);
            el.classList.remove('selected');
        } else {
            selectedCategories.push(cat);
            el.classList.add('selected');
        }
    }

    function startGame() {
        if (players.length < 3) return alert("لایەنی کەم ٣ یاریزان پێویستە");
        if (selectedCategories.length === 0) return alert("لایەنی کەم بەشێک هەڵبژێرە");

        let allWords = [];
        selectedCategories.forEach(cat => {
            allWords = allWords.concat(gameData[cat]);
        });
        
        // هەڵبژاردنی وشەی نهێنی بە شێوەی ڕاندۆم لەو بەشانەی دەستنیشانکراون
        secretWord = allWords[Math.floor(Math.random() * allWords.length)];
        
        let count = Math.min(parseInt(document.getElementById('imposterCount').value) || 1, players.length - 2);
        imposters = [];
        
        let tempPlayers = [...players];
        for(let i=0; i<count; i++) {
            let idx = Math.floor(Math.random() * tempPlayers.length);
            imposters.push(tempPlayers.splice(idx, 1)[0].name);
        }
        
        turnIndex = 0;
        showTurn();
        nextPage(3);
    }

    function showTurn() {
        isRevealed = false;
        document.getElementById('currentPlayerName').innerText = players[turnIndex].name;
        const card = document.getElementById('roleCard');
        card.classList.remove('role-revealed');
        card.innerText = "بۆ بینینی ڕۆڵەکەت کلیک بکە";
        document.getElementById('imposterHelp').style.display = "none";
        document.getElementById('nextTurnBtn').style.display = "none";
    }

    function revealRole() {
        if (isRevealed) return;
        const card = document.getElementById('roleCard');
        card.classList.add('role-revealed');
        if (imposters.includes(players[turnIndex].name)) {
            card.innerText = "تۆ IMPOSTER یت!";
            document.getElementById('imposterHelp').style.display = "block";
        } else {
            card.innerText = "وشەکە: " + secretWord;
        }
        isRevealed = true;
        document.getElementById('nextTurnBtn').style.display = "inline-block";
    }

    function nextTurn() {
        turnIndex++;
        if (turnIndex < players.length) showTurn();
        else startTimer();
    }

    function startTimer() {
        nextPage(4);
        let seconds = parseInt(document.getElementById('gameTime').value) || 60;
        const display = document.getElementById('timerValue');
        timerInterval = setInterval(() => {
            let mins = Math.floor(seconds / 60); let secs = seconds % 60;
            display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            if (seconds <= 0) { clearInterval(timerInterval); showTimeout(); }
            seconds--;
        }, 1000);
    }

    function stopTimerAndGoToTimeout() { clearInterval(timerInterval); showTimeout(); }
    function showTimeout() { nextPage('pageTimeOut'); }

    function finishGame() {
        document.getElementById('finalWord').innerText = secretWord;
        document.getElementById('finalImposters').innerText = imposters.join(" ، ");
        nextPage(5);
    }

    function updateScore(winner) {
        players.forEach(p => {
            if (winner === 'imposters') {
                if (imposters.includes(p.name)) p.score += 3;
            } else {
                if (!imposters.includes(p.name)) p.score += 1;
            }
        });
        renderNames();
        alert("خاڵەکان نوێکرانەوە!");
    }

    function resetToSetup() { nextPage(2); }
</script>
</body>
</html>
