<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imposter Online</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        /* هەمان ستایلەکانی پێشووت لێرە دابنێ - بۆ کورتکردنەوە لێرە لایمان بردووە */
        :root { --purple-main: #6a1b9a; --pure-white: #ffffff; --imposter-red: #ff3d3d; }
        body { background: #1a0b2e; color: white; font-family: sans-serif; text-align: center; }
        .page { display: none; padding: 20px; }
        .active { display: block; }
        input { padding: 10px; border-radius: 8px; margin: 10px; width: 80%; }
        .btn-main { background: var(--purple-main); color: white; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; }
        .room-info { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="setupPage" class="page active">
    <h1>IMPOSTER <span style="color:var(--imposter-red)">ONLINE</span></h1>
    <input type="text" id="userName" placeholder="ناوی خۆت بنووسە">
    <br>
    <input type="text" id="roomCode" placeholder="کۆدی ژوور (بۆ نموونە: 1234)">
    <br>
    <button class="btn-main" onclick="joinRoom()">چوونە ژوورەوە / دروستکردن</button>
</div>

<div id="lobbyPage" class="page">
    <div class="room-info">کۆدی ژوور: <b id="displayRoomCode"></b></div>
    <h3>یاریزانە ئامادەبووەکان:</h3>
    <div id="playerList"></div>
    <br>
    <button id="startBtn" class="btn-main" style="display:none;" onclick="hostStartGame()">دەستپێکردنی یاری</button>
    <p id="waitMsg">چاوەڕێی خاوەن ژوور بکە...</p>
</div>

<div id="gamePage" class="page">
    <h2 id="yourRole">ڕۆڵەکەت</h2>
    <div id="wordDisplay" style="font-size: 30px; margin: 20px; padding: 40px; background: white; color: black; border-radius: 15px;">...</div>
    <p id="gameHint"></p>
</div>

<script>
    // --- ١. لێرە زانیارییەکانی Firebase ی خۆت دابنێ ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = "";
    let roomID = "";
    let isHost = false;

    function joinRoom() {
        myName = document.getElementById('userName').value.trim();
        roomID = document.getElementById('roomCode').value.trim();
        
        if(!myName || !roomID) return alert("ناو و کۆد بنووسە");

        const roomRef = db.ref('rooms/' + roomID);

        roomRef.once('value', snapshot => {
            if (!snapshot.exists()) {
                isHost = true;
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('waitMsg').style.display = 'none';
            }
            
            // زیادکردنی یاریزان
            db.ref('rooms/' + roomID + '/players/' + myName).set({
                name: myName,
                score: 0
            });

            listenToRoom();
            showPage('lobbyPage');
            document.getElementById('displayRoomCode').innerText = roomID;
        });
    }

    function listenToRoom() {
        const roomRef = db.ref('rooms/' + roomID);
        
        // گوێگرتن لە لیستەکە
        roomRef.child('players').on('value', snapshot => {
            const players = snapshot.val();
            let html = "";
            for(let p in players) {
                html += `<div>• ${players[p].name}</div>`;
            }
            document.getElementById('playerList').innerHTML = html;
        });

        // گوێگرتن بۆ کاتی دەستپێکردن
        roomRef.child('gameState').on('value', snapshot => {
            const state = snapshot.val();
            if(state && state.status === "playing") {
                displayRole(state);
            }
        });
    }

    function hostStartGame() {
        const words = ["پیتزا", "کەباب", "مۆبایل", "هەولێر", "پشیلە"];
        const secretWord = words[Math.floor(Math.random() * words.length)];
        
        db.ref('rooms/' + roomID + '/players').once('value', snapshot => {
            const players = Object.keys(snapshot.val());
            const imposter = players[Math.floor(Math.random() * players.length)];
            
            db.ref('rooms/' + roomID + '/gameState').set({
                status: "playing",
                secretWord: secretWord,
                imposter: imposter,
                startTime: Date.now()
            });
        });
    }

    function displayRole(state) {
        showPage('gamePage');
        const display = document.getElementById('wordDisplay');
        if(state.imposter === myName) {
            display.innerText = "تۆ IMPOSTER ـیت!";
            display.style.color = "red";
        } else {
            display.innerText = "وشەکە: " + state.secretWord;
            display.style.color = "black";
        }
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
